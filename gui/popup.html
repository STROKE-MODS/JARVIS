<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    -webkit-app-region: no-drag;
    user-select: none;
  }
  #card {
    width: 100%; height: 100%;
    background: #030805;
    border: 1px solid #c8ff5a;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(200,255,90,0.45), 0 0 30px rgba(200,255,90,0.15);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
  }
  #pulse {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle, #c8ff5a, #7fff00);
    box-shadow: 0 0 8px #c8ff5a;
    animation: pulse 1.1s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.5); opacity: 1; }
  }
  #text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  #title {
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: #c8ff5a;
    letter-spacing: 2px;
    text-shadow: 0 0 6px rgba(200,255,90,0.5);
  }
  #sub {
    font-size: 10px;
    color: #5a7a45;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div id="card">
    <div id="pulse"></div>
    <div id="text">
      <div id="title">LISTENING</div>
      <div id="sub">Speak your command, Sir</div>
    </div>
  </div>
</body>
</html>
